name: Targeted Reliability Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Vitest reliability coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: file:./dev.db
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run targeted reliability coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: targeted-reliability-coverage
          path: coverage/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: core
          name: policywatcher-targeted-reliability
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov not configured
        if: env.CODECOV_TOKEN == ''
        run: echo "CODECOV_TOKEN is not configured; targeted reliability coverage artifact was still generated."
