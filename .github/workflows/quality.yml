name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, and dataset assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: file:./dev.db
      GEMINI_API_KEY: ci-placeholder
      API_SECRET: ci-placeholder-secret
      SESSION_HMAC_SECRET: ci-placeholder-session-secret
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create CI database schema
        run: npx prisma db push

      - name: Seed CI dataset
        run: npx prisma db seed

      - name: Dataset assurance
        run: npm run qa:dataset

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high
