  <rect x="556.5" y="488" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="642.5" y="512" text-anchor="middle" class="micro">read</text>

  <path d="M500 762 C 642.5 762, 642.5 728, 785 728" class="wire-cyan flow"/>
  <rect x="556.5" y="724" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="642.5" y="748" text-anchor="middle" class="micro">operate</text>

