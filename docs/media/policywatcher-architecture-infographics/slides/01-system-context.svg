  <rect x="1193" y="488" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="1279" y="512" text-anchor="middle" class="micro">fetch</text>

  <path d="M1138 728 C 1279 728, 1279 762, 1420 762" class="wire-amber flow"/>
  <rect x="1193" y="724" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="1279" y="748" text-anchor="middle" class="micro">analyze</text>
