<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="deployment-topology-title deployment-topology-desc">
  <title id="deployment-topology-title">Separated application and retrieval control planes</title>
  <desc id="deployment-topology-desc">The app serves users and stores evidence; the VPS runs browser retrieval and controlled recovery operations.</desc>

  <defs>
    <linearGradient id="brandStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6658f6"/>
      <stop offset="0.48" stop-color="#10b8d7"/>
      <stop offset="1" stop-color="#14b878"/>
    </linearGradient>
    <linearGradient id="warmStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f39a18"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#132033" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#132033" flood-opacity="0.09"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#dfe7f0" stroke-width="1" opacity="0.48"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#ecf1f6" stroke-width="1" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#6658f6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#10b8d7"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f39a18"/>
    </marker>
  </defs>

  <style>
    svg { background: #f7f9fc; }
    .grid-bg { fill: url(#grid); opacity: .8; }
    .brand { font-family: Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, serif; }
    .kicker { font-size: 24px; letter-spacing: 3px; text-transform: uppercase; fill: #6658f6; font-weight: 800; }
    .title { font-size: 58px; font-weight: 850; fill: #101827; letter-spacing: 0; }
    .subtitle { font-size: 25px; fill: #526071; font-weight: 520; }
    .small { font-size: 18px; fill: #526071; font-weight: 520; }
    .micro { font-size: 14px; fill: #7b8797; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .node-title { font-size: 24px; fill: #101827; font-weight: 820; }
    .node-sub { font-size: 18px; fill: #526071; font-weight: 500; }
    .panel { fill: rgba(255,255,255,.92); stroke: #d7e0ea; stroke-width: 2; rx: 8; filter: url(#shadow); }
    .soft-panel { fill: rgba(255,255,255,.82); stroke: #d7e0ea; stroke-width: 2; rx: 8; filter: url(#soft); }
    .dark-panel { fill: #162033; stroke: rgba(255,255,255,.16); stroke-width: 2; rx: 8; filter: url(#shadow); }
    .dark-title { fill: #fff; font-size: 25px; font-weight: 820; }
    .dark-sub { fill: #bdc9da; font-size: 17px; font-weight: 520; }
    .chip { fill: #eef1ff; stroke: #c8c3ff; stroke-width: 1.5; rx: 18; }
    .chip-text { fill: #6658f6; font-size: 16px; font-weight: 800; }
    .wire { fill: none; stroke: #6658f6; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    .wire-cyan { fill: none; stroke: #10b8d7; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowCyan); }
    .wire-amber { fill: none; stroke: #f39a18; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowAmber); }
    .faint-wire { fill: none; stroke: #c9d5e4; stroke-width: 3; stroke-linecap: round; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .flow { stroke-dasharray: 12 18; animation: flow 5s linear infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.9s ease forwards; }
    @keyframes flow { to { stroke-dashoffset: -180; } }
    @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect width="1920" height="1080" fill="#f7f9fc"/>
  <rect class="grid-bg" width="1920" height="1080"/>
  <g class="brand">


  <g transform="translate(94 64) scale(1)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#eef1ff" stroke="#cbc7ff" stroke-width="2"/>
    <path d="M15 35c7-18 19-18 24 0" fill="none" stroke="#6658f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="27" cy="22" r="8" fill="none" stroke="#10b8d7" stroke-width="4"/>
    <path d="M15 39h24" stroke="#14b878" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="165" y="86" class="micro">PolicyWatcher v3.5.1</text>
  <text x="165" y="124" class="kicker">Deployment topology</text>
  <text x="94" y="180" class="title">Separated application and</text><text x="94" y="234" class="title">retrieval control planes</text>
  <text x="98" y="276" class="subtitle">The app serves users and stores evidence; the VPS runs browser</text><text x="98" y="306" class="subtitle">retrieval and controlled recovery operations.</text>
  <line x1="94" y1="324" x2="1826" y2="324" stroke="#d8e1ec" stroke-width="2"/>
  <rect x="1590" y="72" width="236" height="48" rx="24" fill="#ffffff" stroke="#d8e1ec" stroke-width="2"/>
  <circle cx="1622" cy="96" r="7" fill="#14b878"/>
  <text x="1640" y="102" class="small" style="font-weight:800; fill:#101827;">Evidence-first diagrams</text>

    <rect x="106" y="332" width="820" height="600" rx="8" class="panel"/>
    <rect x="994" y="332" width="820" height="600" rx="8" class="panel"/>
    <text x="152" y="392" class="node-title">Hostinger application runtime</text>
    <text x="1040" y="392" class="node-title">VPS companion runtime</text>

  <g>
    <rect x="152" y="420" width="230" height="38" rx="19" fill="#fff" stroke="#6658f6" stroke-width="2"/>
    <circle cx="174" cy="439" r="6" fill="#6658f6"/>
    <text x="190" y="445" class="chip-text" style="fill:#6658f6;">policywatcher.online</text>
  </g>

  <g>
    <rect x="1040" y="420" width="220" height="38" rx="19" fill="#fff" stroke="#10b8d7" stroke-width="2"/>
    <circle cx="1062" cy="439" r="6" fill="#10b8d7"/>
    <text x="1078" y="445" class="chip-text" style="fill:#10b8d7;">187.124.184.225</text>
  </g>


  <g>
    <rect x="152" y="500" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="152" y="500" width="8" height="118" rx="4" fill="#6658f6"/>
    <text x="180" y="542" class="node-title">Next.js app</text>
    <text x="180" y="578" class="node-sub">Public UI, admin UI</text><text x="180" y="606" class="node-sub">API routes</text>
  </g>

  <g>
    <rect x="555" y="500" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="555" y="500" width="8" height="118" rx="4" fill="#10b8d7"/>
    <text x="583" y="542" class="node-title">SQLite DB</text>
    <text x="583" y="578" class="node-sub">production.db</text><text x="583" y="606" class="node-sub">persistent data path</text>
  </g>

  <g>
    <rect x="152" y="680" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="152" y="680" width="8" height="118" rx="4" fill="#f39a18"/>
    <text x="180" y="722" class="node-title">Environment</text>
    <text x="180" y="758" class="node-sub">Secrets stay server-side</text><text x="180" y="786" class="node-sub">DATABASE_URL, API keys</text>
  </g>

  <g>
    <rect x="555" y="680" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="555" y="680" width="8" height="118" rx="4" fill="#14b878"/>
    <text x="583" y="722" class="node-title">Public gate</text>
    <text x="583" y="758" class="node-sub">publicEvidence</text><text x="583" y="786" class="node-sub">dataStatus filters</text>
  </g>


  <g>
    <rect x="1040" y="500" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="1040" y="500" width="8" height="118" rx="4" fill="#10b8d7"/>
    <text x="1068" y="542" class="node-title">nginx + TLS</text>
    <text x="1068" y="578" class="node-sub">render and ops domains</text><text x="1068" y="606" class="node-sub">reverse proxy</text>
  </g>

  <g>
    <rect x="1448" y="500" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="1448" y="500" width="8" height="118" rx="4" fill="#6658f6"/>
    <text x="1476" y="542" class="node-title">Renderer service</text>
    <text x="1476" y="578" class="node-sub">Playwright DOM retrieval</text><text x="1476" y="606" class="node-sub">Bearer auth</text>
  </g>

  <g>
    <rect x="1040" y="680" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="1040" y="680" width="8" height="118" rx="4" fill="#14b878"/>
    <text x="1068" y="722" class="node-title">Operations agent</text>
    <text x="1068" y="758" class="node-sub">HMAC signed controls</text><text x="1068" y="786" class="node-sub">backup and rollback</text>
  </g>

  <g>
    <rect x="1448" y="680" width="315" height="118" rx="8" class="soft-panel"/>
    <rect x="1448" y="680" width="8" height="118" rx="4" fill="#f39a18"/>
    <text x="1476" y="722" class="node-title">Versioned current</text>
    <text x="1476" y="758" class="node-sub">symlink release layout</text><text x="1476" y="786" class="node-sub">packages and backups</text>
  </g>


  <path d="M467 559 C 511 559, 511 559, 555 559" class="wire-cyan flow"/>


  <path d="M467 740 C 511 740, 511 740, 555 740" class="wire-amber flow"/>


  <path d="M870 560 C 955 560, 955 560, 1040 560" class="wire flow"/>
  <rect x="869" y="539" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="955" y="563" text-anchor="middle" class="micro">render</text>

  <path d="M870 742 C 955 742, 955 742, 1040 742" class="wire-cyan flow"/>
  <rect x="869" y="721" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="955" y="745" text-anchor="middle" class="micro">ops</text>

  <path d="M1355 559 C 1401.5 559, 1401.5 559, 1448 559" class="wire flow"/>


  <path d="M1355 742 C 1401.5 742, 1401.5 742, 1448 742" class="wire-amber flow"/>



  <text x="94" y="1014" class="micro">Source-backed evidence mapping, not certification</text>
  <text x="1826" y="1014" class="micro" text-anchor="end">Architecture infographics</text>
  </g>
</svg>