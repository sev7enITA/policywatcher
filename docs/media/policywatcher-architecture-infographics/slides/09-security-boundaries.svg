<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="security-boundaries-title security-boundaries-desc">
  <title id="security-boundaries-title">Trust is enforced at route, data and service boundaries</title>
  <desc id="security-boundaries-desc">Secrets stay server-side, admin operations are logged, and retrieval paths are constrained.</desc>

  <defs>
    <linearGradient id="brandStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6658f6"/>
      <stop offset="0.48" stop-color="#10b8d7"/>
      <stop offset="1" stop-color="#14b878"/>
    </linearGradient>
    <linearGradient id="warmStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f39a18"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#132033" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#132033" flood-opacity="0.09"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#dfe7f0" stroke-width="1" opacity="0.48"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#ecf1f6" stroke-width="1" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#6658f6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#10b8d7"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f39a18"/>
    </marker>
  </defs>

  <style>
    svg { background: #f7f9fc; }
    .grid-bg { fill: url(#grid); opacity: .8; }
    .brand { font-family: Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, serif; }
    .kicker { font-size: 24px; letter-spacing: 3px; text-transform: uppercase; fill: #6658f6; font-weight: 800; }
    .title { font-size: 58px; font-weight: 850; fill: #101827; letter-spacing: 0; }
    .subtitle { font-size: 25px; fill: #526071; font-weight: 520; }
    .small { font-size: 18px; fill: #526071; font-weight: 520; }
    .micro { font-size: 14px; fill: #7b8797; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .node-title { font-size: 24px; fill: #101827; font-weight: 820; }
    .node-sub { font-size: 18px; fill: #526071; font-weight: 500; }
    .panel { fill: rgba(255,255,255,.92); stroke: #d7e0ea; stroke-width: 2; rx: 8; filter: url(#shadow); }
    .soft-panel { fill: rgba(255,255,255,.82); stroke: #d7e0ea; stroke-width: 2; rx: 8; filter: url(#soft); }
    .dark-panel { fill: #162033; stroke: rgba(255,255,255,.16); stroke-width: 2; rx: 8; filter: url(#shadow); }
    .dark-title { fill: #fff; font-size: 25px; font-weight: 820; }
    .dark-sub { fill: #bdc9da; font-size: 17px; font-weight: 520; }
    .chip { fill: #eef1ff; stroke: #c8c3ff; stroke-width: 1.5; rx: 18; }
    .chip-text { fill: #6658f6; font-size: 16px; font-weight: 800; }
    .wire { fill: none; stroke: #6658f6; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    .wire-cyan { fill: none; stroke: #10b8d7; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowCyan); }
    .wire-amber { fill: none; stroke: #f39a18; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowAmber); }
    .faint-wire { fill: none; stroke: #c9d5e4; stroke-width: 3; stroke-linecap: round; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .flow { stroke-dasharray: 12 18; animation: flow 5s linear infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.9s ease forwards; }
    @keyframes flow { to { stroke-dashoffset: -180; } }
    @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect width="1920" height="1080" fill="#f7f9fc"/>
  <rect class="grid-bg" width="1920" height="1080"/>
  <g class="brand">


  <g transform="translate(94 64) scale(1)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#eef1ff" stroke="#cbc7ff" stroke-width="2"/>
    <path d="M15 35c7-18 19-18 24 0" fill="none" stroke="#6658f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="27" cy="22" r="8" fill="none" stroke="#10b8d7" stroke-width="4"/>
    <path d="M15 39h24" stroke="#14b878" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="165" y="86" class="micro">PolicyWatcher v3.5.1</text>
  <text x="165" y="124" class="kicker">Security boundaries</text>
  <text x="94" y="180" class="title">Trust is enforced at route, data</text><text x="94" y="234" class="title">and service boundaries</text>
  <text x="98" y="276" class="subtitle">Secrets stay server-side, admin operations are logged, and retrieval</text><text x="98" y="306" class="subtitle">paths are constrained.</text>
  <line x1="94" y1="324" x2="1826" y2="324" stroke="#d8e1ec" stroke-width="2"/>
  <rect x="1590" y="72" width="236" height="48" rx="24" fill="#ffffff" stroke="#d8e1ec" stroke-width="2"/>
  <circle cx="1622" cy="96" r="7" fill="#14b878"/>
  <text x="1640" y="102" class="small" style="font-weight:800; fill:#101827;">Evidence-first diagrams</text>

    <rect x="106" y="334" width="1708" height="596" rx="8" class="panel"/>
    <rect x="164" y="410" width="420" height="390" rx="8" fill="#fff" stroke="#d7e0ea" stroke-width="2"/>
    <rect x="750" y="410" width="420" height="390" rx="8" fill="#fff" stroke="#d7e0ea" stroke-width="2"/>
    <rect x="1336" y="410" width="420" height="390" rx="8" fill="#fff" stroke="#d7e0ea" stroke-width="2"/>
    <g transform="translate(346 472)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#6658f6" stroke-width="4"/>
    <path d="M4 28h48M28 4c-9 9-9 39 0 48M28 4c9 9 9 39 0 48" fill="none" stroke="#6658f6" stroke-width="3"/>
  </g>
    <g transform="translate(930 468)">
    <path d="M30 5l22 8v18c0 16-10 25-22 31C18 56 8 47 8 31V13l22-8z" fill="none" stroke="#14b878" stroke-width="4" stroke-linejoin="round"/>
    <path d="M19 32l8 8 16-18" fill="none" stroke="#14b878" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <g transform="translate(1516 472)">
    <rect x="4" y="6" width="52" height="18" rx="5" fill="none" stroke="#10b8d7" stroke-width="4"/>
    <rect x="4" y="32" width="52" height="18" rx="5" fill="none" stroke="#10b8d7" stroke-width="4"/>
    <circle cx="44" cy="15" r="3" fill="#10b8d7"/><circle cx="44" cy="41" r="3" fill="#10b8d7"/>
  </g>
    <text x="374" y="590" text-anchor="middle" class="node-title">Public boundary</text>
    <text x="374" y="628" text-anchor="middle" class="node-sub">read-only, evidence-gated</text>
    <text x="374" y="662" text-anchor="middle" class="node-sub">no seeded data in production</text>
    <text x="960" y="590" text-anchor="middle" class="node-title">Admin boundary</text>
    <text x="960" y="628" text-anchor="middle" class="node-sub">session cookie and roles</text>
    <text x="960" y="662" text-anchor="middle" class="node-sub">review and access logs</text>
    <text x="1546" y="590" text-anchor="middle" class="node-title">Retrieval boundary</text>
    <text x="1546" y="628" text-anchor="middle" class="node-sub">SSRF guard and URL validation</text>
    <text x="1546" y="662" text-anchor="middle" class="node-sub">sanitized external errors</text>

  <path d="M584 610 C 667 610, 667 610, 750 610" class="wire-cyan flow"/>
  <rect x="581" y="589" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="667" y="613" text-anchor="middle" class="micro">auth</text>

  <path d="M1170 610 C 1253 610, 1253 610, 1336 610" class="wire flow"/>
  <rect x="1167" y="589" width="172" height="34" rx="17" fill="#fff" stroke="#d8e1ec"/><text x="1253" y="613" text-anchor="middle" class="micro">server-side secrets</text>
    <rect x="420" y="845" width="1080" height="54" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="960" y="879" text-anchor="middle" class="small" style="fill:#0e7490; font-weight:850;">Public inspection, admin authority and retrieval capability remain separate trust zones.</text>


  <text x="94" y="1014" class="micro">Source-backed evidence mapping, not certification</text>
  <text x="1826" y="1014" class="micro" text-anchor="end">Architecture infographics</text>
  </g>
</svg>