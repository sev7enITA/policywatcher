<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="kpi-lifecycle-title kpi-lifecycle-desc">
  <title id="kpi-lifecycle-title">Baseline evidence and KPI assessment are separate states</title>
  <desc id="kpi-lifecycle-desc">The matrix is populated by source-backed AI assessments, not by seeded placeholders or unverified defaults.</desc>

  <defs>
    <linearGradient id="brandStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6658f6"/>
      <stop offset="0.48" stop-color="#10b8d7"/>
      <stop offset="1" stop-color="#14b878"/>
    </linearGradient>
    <linearGradient id="warmStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f39a18"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#132033" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#132033" flood-opacity="0.09"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#dfe7f0" stroke-width="1" opacity="0.48"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#ecf1f6" stroke-width="1" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#6658f6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#10b8d7"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f39a18"/>
    </marker>
  </defs>

  <style>
    svg { background: #f7f9fc; }
    .grid-bg { fill: url(#grid); opacity: .8; }
    .brand { font-family: Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, serif; }
    .kicker { font-size: 24px; letter-spacing: 3px; text-transform: uppercase; fill: #6658f6; font-weight: 800; }
    .title { font-size: 58px; font-weight: 850; fill: #101827; letter-spacing: 0; }
    .subtitle { font-size: 25px; fill: #526071; font-weight: 520; }
    .small { font-size: 18px; fill: #526071; font-weight: 520; }
    .micro { font-size: 14px; fill: #7b8797; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .node-title { font-size: 24px; fill: #101827; font-weight: 820; }
    .node-sub { font-size: 18px; fill: #526071; font-weight: 500; }
    .panel { fill: rgba(255,255,255,.92); stroke: #d7e0ea; stroke-width: 2; rx: 8; filter: url(#shadow); }
    .soft-panel { fill: rgba(255,255,255,.82); stroke: #d7e0ea; stroke-width: 2; rx: 8; filter: url(#soft); }
    .dark-panel { fill: #162033; stroke: rgba(255,255,255,.16); stroke-width: 2; rx: 8; filter: url(#shadow); }
    .dark-title { fill: #fff; font-size: 25px; font-weight: 820; }
    .dark-sub { fill: #bdc9da; font-size: 17px; font-weight: 520; }
    .chip { fill: #eef1ff; stroke: #c8c3ff; stroke-width: 1.5; rx: 18; }
    .chip-text { fill: #6658f6; font-size: 16px; font-weight: 800; }
    .wire { fill: none; stroke: #6658f6; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    .wire-cyan { fill: none; stroke: #10b8d7; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowCyan); }
    .wire-amber { fill: none; stroke: #f39a18; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowAmber); }
    .faint-wire { fill: none; stroke: #c9d5e4; stroke-width: 3; stroke-linecap: round; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .flow { stroke-dasharray: 12 18; animation: flow 5s linear infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.9s ease forwards; }
    @keyframes flow { to { stroke-dashoffset: -180; } }
    @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect width="1920" height="1080" fill="#f7f9fc"/>
  <rect class="grid-bg" width="1920" height="1080"/>
  <g class="brand">


  <g transform="translate(94 64) scale(1)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#eef1ff" stroke="#cbc7ff" stroke-width="2"/>
    <path d="M15 35c7-18 19-18 24 0" fill="none" stroke="#6658f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="27" cy="22" r="8" fill="none" stroke="#10b8d7" stroke-width="4"/>
    <path d="M15 39h24" stroke="#14b878" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="165" y="86" class="micro">PolicyWatcher v3.5.1</text>
  <text x="165" y="124" class="kicker">KPI lifecycle</text>
  <text x="94" y="180" class="title">Baseline evidence and KPI</text><text x="94" y="234" class="title">assessment are separate states</text>
  <text x="98" y="276" class="subtitle">The matrix is populated by source-backed AI assessments, not by</text><text x="98" y="306" class="subtitle">seeded placeholders or unverified defaults.</text>
  <line x1="94" y1="324" x2="1826" y2="324" stroke="#d8e1ec" stroke-width="2"/>
  <rect x="1590" y="72" width="236" height="48" rx="24" fill="#ffffff" stroke="#d8e1ec" stroke-width="2"/>
  <circle cx="1622" cy="96" r="7" fill="#14b878"/>
  <text x="1640" y="102" class="small" style="font-weight:800; fill:#101827;">Evidence-first diagrams</text>

    <rect x="106" y="334" width="1708" height="596" rx="8" class="panel"/>

  <g>
    <rect x="145" y="465" width="310" height="145" rx="8" class="soft-panel"/>
    <rect x="145" y="465" width="8" height="145" rx="4" fill="#14b878"/>
    <text x="173" y="507" class="node-title">Verified baseline</text>
    <text x="173" y="543" class="node-sub">Source-backed snapshot</text><text x="173" y="571" class="node-sub">No fake change event</text>
  </g>

  <g>
    <rect x="545" y="465" width="310" height="145" rx="8" class="soft-panel"/>
    <rect x="545" y="465" width="8" height="145" rx="4" fill="#f39a18"/>
    <text x="573" y="507" class="node-title">Assessment pending</text>
    <text x="573" y="543" class="node-sub">Valid baseline, no KPI yet</text><text x="573" y="571" class="node-sub">Visible in admin QA</text>
  </g>

  <g>
    <rect x="945" y="465" width="310" height="145" rx="8" class="soft-panel"/>
    <rect x="945" y="465" width="8" height="145" rx="4" fill="#6658f6"/>
    <text x="973" y="507" class="node-title">Real change</text>
    <text x="973" y="543" class="node-sub">Hash differs from baseline</text><text x="973" y="571" class="node-sub">Gemini structured analysis</text>
  </g>

  <g>
    <rect x="1345" y="465" width="310" height="145" rx="8" class="soft-panel"/>
    <rect x="1345" y="465" width="8" height="145" rx="4" fill="#10b8d7"/>
    <text x="1373" y="507" class="node-title">KPI matrix</text>
    <text x="1373" y="543" class="node-sub">15 normalized fields</text><text x="1373" y="571" class="node-sub">Public only when assessed</text>
  </g>

  <path d="M455 538 C 500 538, 500 538, 545 538" class="wire-amber flow"/>


  <path d="M855 538 C 900 538, 900 538, 945 538" class="wire flow"/>


  <path d="M1255 538 C 1300 538, 1300 538, 1345 538" class="wire-cyan flow"/>

    <g transform="translate(250 730)">
      <rect x="0" y="0" width="240" height="36" rx="18" fill="#fff" stroke="#6658f6" stroke-width="2"/><text x="120" y="24" text-anchor="middle" class="micro" style="fill:#6658f6;">Data</text><rect x="282" y="0" width="240" height="36" rx="18" fill="#fff" stroke="#10b8d7" stroke-width="2"/><text x="402" y="24" text-anchor="middle" class="micro" style="fill:#10b8d7;">Sharing</text><rect x="564" y="0" width="240" height="36" rx="18" fill="#fff" stroke="#14b878" stroke-width="2"/><text x="684" y="24" text-anchor="middle" class="micro" style="fill:#14b878;">Retention</text><rect x="846" y="0" width="240" height="36" rx="18" fill="#fff" stroke="#f39a18" stroke-width="2"/><text x="966" y="24" text-anchor="middle" class="micro" style="fill:#f39a18;">Deletion</text><rect x="1128" y="0" width="240" height="36" rx="18" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="1248" y="24" text-anchor="middle" class="micro" style="fill:#ef4444;">Transfer</text><rect x="0" y="56" width="240" height="36" rx="18" fill="#fff" stroke="#6658f6" stroke-width="2"/><text x="120" y="80" text-anchor="middle" class="micro" style="fill:#6658f6;">AI opt-out</text><rect x="282" y="56" width="240" height="36" rx="18" fill="#fff" stroke="#10b8d7" stroke-width="2"/><text x="402" y="80" text-anchor="middle" class="micro" style="fill:#10b8d7;">Ownership</text><rect x="564" y="56" width="240" height="36" rx="18" fill="#fff" stroke="#14b878" stroke-width="2"/><text x="684" y="80" text-anchor="middle" class="micro" style="fill:#14b878;">Algo</text><rect x="846" y="56" width="240" height="36" rx="18" fill="#fff" stroke="#f39a18" stroke-width="2"/><text x="966" y="80" text-anchor="middle" class="micro" style="fill:#f39a18;">Auto</text><rect x="1128" y="56" width="240" height="36" rx="18" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="1248" y="80" text-anchor="middle" class="micro" style="fill:#ef4444;">Bias</text><rect x="0" y="112" width="240" height="36" rx="18" fill="#fff" stroke="#6658f6" stroke-width="2"/><text x="120" y="136" text-anchor="middle" class="micro" style="fill:#6658f6;">Consent</text><rect x="282" y="112" width="240" height="36" rx="18" fill="#fff" stroke="#10b8d7" stroke-width="2"/><text x="402" y="136" text-anchor="middle" class="micro" style="fill:#10b8d7;">Compliance</text><rect x="564" y="112" width="240" height="36" rx="18" fill="#fff" stroke="#14b878" stroke-width="2"/><text x="684" y="136" text-anchor="middle" class="micro" style="fill:#14b878;">Breach</text><rect x="846" y="112" width="240" height="36" rx="18" fill="#fff" stroke="#f39a18" stroke-width="2"/><text x="966" y="136" text-anchor="middle" class="micro" style="fill:#f39a18;">Audit</text><rect x="1128" y="112" width="240" height="36" rx="18" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="1248" y="136" text-anchor="middle" class="micro" style="fill:#ef4444;">Moderation</text>
    </g>


  <text x="94" y="1014" class="micro">Source-backed evidence mapping, not certification</text>
  <text x="1826" y="1014" class="micro" text-anchor="end">Architecture infographics</text>
  </g>
</svg>