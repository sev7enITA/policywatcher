<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2700" viewBox="0 0 1800 2700" role="img" aria-labelledby="title description" font-family="Helvetica">
  <title id="title">PolicyWatcher 4 Foundation Beta release infographic</title>
  <desc id="description">Detailed English infographic describing the canonical evidence chain, taxonomy, publication readiness snapshot, migration controls, runtime boundary, verification evidence and production limits of PolicyWatcher 4.0.0 Beta 1.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10223b"/>
      <stop offset="1" stop-color="#163d52"/>
    </linearGradient>
    <linearGradient id="metric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e5555"/>
      <stop offset="1" stop-color="#146c6a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#10223b" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Helvetica; }
      .eyebrow { font-size: 25px; font-weight: 700; letter-spacing: 4px; }
      .section { font-size: 27px; font-weight: 700; letter-spacing: 3px; fill: #146c6a; }
      .body { font-size: 28px; fill: #33485c; }
      .small { font-size: 23px; fill: #52677a; }
      .tiny { font-size: 20px; fill: #607386; }
      .label { font-size: 24px; font-weight: 700; fill: #10223b; }
      .value { font-size: 46px; font-weight: 700; fill: #10223b; }
    </style>
  </defs>

  <rect width="1800" height="2700" fill="#f2efe8"/>
  <image xlink:href="policywatcher-v4-foundation-background-ai-2026-08-20.png" width="1800" height="2700" preserveAspectRatio="xMidYMid slice" opacity="0.18"/>

  <rect width="1800" height="455" fill="url(#header)"/>
  <image xlink:href="../../../public/press-kit/policywatcher-wordmark-light-on-navy-2400x600.png" x="92" y="66" width="560" height="140" preserveAspectRatio="xMinYMid meet"/>
  <text class="sans eyebrow" x="105" y="240" fill="#82c8c5">FOUNDATION BETA / AUGUST 2026</text>
  <text class="sans" x="105" y="320" font-size="69" font-weight="700" fill="#ffffff">PolicyWatcher 4.0.0 Beta 1</text>
  <text class="sans" x="105" y="382" font-size="36" fill="#d8e7e4">Canonical Evidence Foundation</text>
  <rect x="1300" y="86" width="390" height="118" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#82c8c5"/>
  <text class="sans" x="1332" y="130" font-size="22" font-weight="700" fill="#82c8c5">RELEASE RECORD</text>
  <text class="sans" x="1332" y="174" font-size="31" font-weight="700" fill="#ffffff">19 August 2026</text>
  <rect x="1300" y="226" width="390" height="118" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#e0a447"/>
  <text class="sans" x="1332" y="270" font-size="22" font-weight="700" fill="#f0c77b">GITHUB PRERELEASE</text>
  <text class="sans" x="1332" y="314" font-size="31" font-weight="700" fill="#ffffff">20 August 2026</text>

  <g transform="translate(90 515)">
    <text class="sans section" x="0" y="0">01 / CANONICAL EVIDENCE CHAIN</text>
    <text class="sans body" x="0" y="48">A durable additive graph links each source record to the policy language it supports.</text>
    <line x1="125" y1="165" x2="1515" y2="165" stroke="#146c6a" stroke-width="7"/>
    <g class="sans" text-anchor="middle">
      <g transform="translate(135 165)"><circle r="67" fill="#ffffff" stroke="#146c6a" stroke-width="6" filter="url(#shadow)"/><text y="9" font-size="31" font-weight="700" fill="#10223b">Entity</text><text y="105" font-size="22" fill="#52677a">monitored actor</text></g>
      <g transform="translate(480 165)"><circle r="67" fill="#ffffff" stroke="#146c6a" stroke-width="6" filter="url(#shadow)"/><text y="9" font-size="31" font-weight="700" fill="#10223b">Document</text><text y="105" font-size="22" fill="#52677a">policy source</text></g>
      <g transform="translate(825 165)"><circle r="67" fill="#ffffff" stroke="#146c6a" stroke-width="6" filter="url(#shadow)"/><text y="9" font-size="31" font-weight="700" fill="#10223b">Version</text><text y="105" font-size="22" fill="#52677a">captured text</text></g>
      <g transform="translate(1170 165)"><circle r="67" fill="#ffffff" stroke="#e0a447" stroke-width="6" filter="url(#shadow)"/><text y="9" font-size="31" font-weight="700" fill="#10223b">Change</text><text y="105" font-size="22" fill="#52677a">observed delta</text></g>
      <g transform="translate(1515 165)"><circle r="67" fill="#ffffff" stroke="#146c6a" stroke-width="6" filter="url(#shadow)"/><text y="9" font-size="29" font-weight="700" fill="#10223b">Provision</text><text y="105" font-size="22" fill="#52677a">classified clause</text></g>
    </g>
    <rect x="0" y="320" width="1620" height="84" rx="18" fill="#e4efec"/>
    <text class="sans" x="34" y="372" font-size="27" font-weight="700" fill="#23495a">Stable public IDs:</text>
    <text class="sans" x="268" y="372" font-size="27" fill="#23495a">deterministic references remain independent from internal UUIDs, names and URLs.</text>
  </g>

  <g transform="translate(90 1000)">
    <text class="sans section" x="0" y="0">02 / PROVISION TAXONOMY 1.0.0</text>
    <text class="sans body" x="0" y="48">Initial coverage for six recurring policy topics.</text>
    <g class="sans" font-size="27" font-weight="700" fill="#10223b">
      <g transform="translate(0 92)"><rect width="505" height="74" rx="37" fill="#ffffff" stroke="#bdd3d0"/><circle cx="39" cy="37" r="11" fill="#146c6a"/><text x="70" y="47">AI training</text></g>
      <g transform="translate(557 92)"><rect width="505" height="74" rx="37" fill="#ffffff" stroke="#bdd3d0"/><circle cx="39" cy="37" r="11" fill="#146c6a"/><text x="70" y="47">Data sharing</text></g>
      <g transform="translate(1115 92)"><rect width="505" height="74" rx="37" fill="#ffffff" stroke="#bdd3d0"/><circle cx="39" cy="37" r="11" fill="#146c6a"/><text x="70" y="47">Retention</text></g>
      <g transform="translate(0 188)"><rect width="505" height="74" rx="37" fill="#ffffff" stroke="#bdd3d0"/><circle cx="39" cy="37" r="11" fill="#e0a447"/><text x="70" y="47">Arbitration</text></g>
      <g transform="translate(557 188)"><rect width="505" height="74" rx="37" fill="#ffffff" stroke="#bdd3d0"/><circle cx="39" cy="37" r="11" fill="#e0a447"/><text x="70" y="47">Content licensing</text></g>
      <g transform="translate(1115 188)"><rect width="505" height="74" rx="37" fill="#ffffff" stroke="#bdd3d0"/><circle cx="39" cy="37" r="11" fill="#e0a447"/><text x="70" y="47">Liability</text></g>
    </g>
    <text class="sans small" x="0" y="310">Classification of observed language only. No determination of legal validity, applicability or compliance.</text>
  </g>

  <g transform="translate(90 1390)" filter="url(#shadow)">
    <rect width="1620" height="438" rx="32" fill="url(#metric)"/>
    <text class="sans eyebrow" x="48" y="62" fill="#bfe5df">03 / ONE AUTHORITATIVE PUBLICATION-READINESS CONTRACT</text>
    <text class="sans" x="48" y="112" font-size="25" fill="#ffffff">Database-derived snapshot observed 20 August 2026 at 02:32 UTC</text>
    <g class="sans" transform="translate(44 153)">
      <g transform="translate(0 0)"><rect width="285" height="154" rx="22" fill="#ffffff" fill-opacity="0.96"/><text class="value" x="28" y="67">50</text><text class="label" x="28" y="107">Configured</text><text class="tiny" x="28" y="136">of 50</text></g>
      <g transform="translate(318 0)"><rect width="285" height="154" rx="22" fill="#ffffff" fill-opacity="0.96"/><text class="value" x="28" y="67">50</text><text class="label" x="28" y="107">Retrieved</text><text class="tiny" x="28" y="136">of 50</text></g>
      <g transform="translate(636 0)"><rect width="285" height="154" rx="22" fill="#ffffff" fill-opacity="0.96"/><text class="value" x="28" y="67">50</text><text class="label" x="28" y="107">Baseline verified</text><text class="tiny" x="28" y="136">of 50</text></g>
      <g transform="translate(954 0)"><rect width="285" height="154" rx="22" fill="#ffffff" fill-opacity="0.96"/><text class="value" x="28" y="67">44</text><text class="label" x="28" y="107">Public</text><text class="tiny" x="28" y="136">6 excluded</text></g>
      <g transform="translate(1272 0)"><rect width="260" height="154" rx="22" fill="#ffffff" fill-opacity="0.96"/><text class="value" x="28" y="67">28</text><text class="label" x="28" y="107">Analysed</text><text class="tiny" x="28" y="136">22 excluded</text></g>
    </g>
    <line x1="48" y1="336" x2="1572" y2="336" stroke="#bfe5df" stroke-opacity="0.45"/>
    <text class="sans" x="48" y="383" font-size="25" font-weight="700" fill="#ffffff">Latest successful capture:</text>
    <text class="sans" x="365" y="383" font-size="25" fill="#ffffff">19 August 2026, 07:55 UTC</text>
    <text class="sans" x="48" y="416" font-size="20" fill="#cde7e3">Aggregate operational evidence. Counts do not establish completeness, legal review or analysis quality.</text>
  </g>

  <g transform="translate(90 1900)">
    <text class="sans section" x="0" y="0">04 / CONTROLLED MIGRATION PATH</text>
    <g class="sans" transform="translate(0 54)">
      <g><rect width="500" height="224" rx="28" fill="#ffffff" stroke="#bdd3d0" filter="url(#shadow)"/><text x="34" y="52" font-size="23" font-weight="700" fill="#146c6a">BACKFILL</text><text x="34" y="100" font-size="30" font-weight="700" fill="#10223b">Guarded and idempotent</text><text x="34" y="143" font-size="23" fill="#52677a">Dry-run first. Apply requires</text><text x="34" y="176" font-size="23" fill="#52677a">an explicit acknowledgement.</text></g>
      <g transform="translate(560 0)"><rect width="500" height="224" rx="28" fill="#ffffff" stroke="#bdd3d0" filter="url(#shadow)"/><text x="34" y="52" font-size="23" font-weight="700" fill="#146c6a">RECONCILIATION</text><text x="34" y="100" font-size="30" font-weight="700" fill="#10223b">Deterministic parity</text><text x="34" y="143" font-size="23" fill="#52677a">Counts, IDs, hashes, links,</text><text x="34" y="176" font-size="23" fill="#52677a">gates, taxonomy and orphans.</text></g>
      <g transform="translate(1120 0)"><rect width="500" height="224" rx="28" fill="#ffffff" stroke="#e0a447" filter="url(#shadow)"/><text x="34" y="52" font-size="23" font-weight="700" fill="#b27113">DUAL-WRITE</text><text x="34" y="100" font-size="30" font-weight="700" fill="#10223b">Transactional and opt-in</text><text x="34" y="143" font-size="23" fill="#52677a">Canonical failure rolls back</text><text x="34" y="176" font-size="23" fill="#52677a">the associated legacy write.</text></g>
    </g>
  </g>

  <g transform="translate(90 2250)" class="sans">
    <rect width="785" height="274" rx="28" fill="#e7efee" stroke="#bdd3d0"/>
    <text x="35" y="52" font-size="23" font-weight="700" fill="#146c6a">RUNTIME BOUNDARY</text>
    <text x="35" y="99" font-size="28" font-weight="700" fill="#10223b">SQLite remains current production</text>
    <text x="35" y="143" font-size="23" fill="#52677a">PostgreSQL schema, migration, import and</text>
    <text x="35" y="176" font-size="23" fill="#52677a">dual-write smoke are verified in isolated CI.</text>
    <text x="35" y="219" font-size="23" fill="#52677a">Object storage and canonical reads are gated.</text>

    <rect x="835" width="785" height="274" rx="28" fill="#ffffff" stroke="#bdd3d0"/>
    <text x="870" y="52" font-size="23" font-weight="700" fill="#146c6a">PROMOTION EVIDENCE</text>
    <text x="870" y="101" font-size="38" font-weight="700" fill="#10223b">153 files / 999 tests</text>
    <text x="870" y="147" font-size="23" fill="#52677a">Quality, PostgreSQL, coverage, Sonar,</text>
    <text x="870" y="180" font-size="23" fill="#52677a">CodeQL and OpenSSF passed on main.</text>
    <text x="870" y="223" font-size="21" fill="#52677a">Source commit: 13b3b61</text>
  </g>

  <g transform="translate(0 2550)">
    <rect width="1800" height="150" fill="#10223b"/>
    <text class="sans" x="90" y="36" font-size="21" font-weight="700" fill="#82c8c5">FOUNDATION BETA BOUNDARY</text>
    <text class="sans" x="90" y="70" font-size="21" fill="#ffffff">GitHub source is promoted. Hostinger v4 deployment, live backfill, dual-write activation and the</text>
    <text class="sans" x="90" y="98" font-size="21" fill="#ffffff">canonical read and infrastructure cutovers remain separately gated.</text>
    <text class="sans" x="90" y="130" font-size="17" fill="#a9bfca">Sources: release audit, migration runbook, GitHub checks and publication-readiness API. AI background disclosed; text and composition are deterministic.</text>
  </g>
</svg>
