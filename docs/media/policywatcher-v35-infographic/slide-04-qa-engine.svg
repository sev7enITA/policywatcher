<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PolicyWatcher 3.5 Dataset QA Engine</title>
  <desc id="desc">Dedicated slide describing the PolicyWatcher 3.5 dataset quality assurance engine, including integrity checks, retrieval evidence, coverage checks, human review and release gate decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#dbe4f0" stroke-width="1" opacity="0.32"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#10b981"/>
    </marker>
    <style>
      .font { font-family: Arial; }
      .mono { font-family: Monaco; }
      .title { font-size: 50px; font-weight: 870; fill: #0f172a; letter-spacing: -0.5px; }
      .subtitle { font-size: 20px; font-weight: 560; fill: #475569; }
      .eyebrow { font-size: 17px; font-weight: 860; fill: #047857; letter-spacing: 2.6px; }
      .card { fill: rgba(255,255,255,0.96); stroke: #dbe4f0; stroke-width: 1.5; filter: url(#shadow); }
      .darkCard { fill: #0f172a; filter: url(#shadow); }
      .blockTitle { font-size: 22px; font-weight: 850; fill: #0f172a; }
      .blockBody { font-size: 15.5px; font-weight: 580; fill: #475569; }
      .small { font-size: 14px; font-weight: 800; fill: #64748b; letter-spacing: 1px; }
      .metric { font-size: 54px; font-weight: 900; fill: #0f172a; }
      .metricDark { font-size: 54px; font-weight: 900; fill: #ffffff; }
      .metricLabel { font-size: 15px; font-weight: 860; fill: #64748b; letter-spacing: 1.4px; }
      .chip { font-size: 14px; font-weight: 850; fill: #334155; }
      .scan { opacity: 0.68; animation: scan 3.8s ease-in-out infinite; }
      .trace { stroke-dasharray: 12 18; animation: dash 13s linear infinite; }
      @keyframes scan { 0%,100% { transform: translateY(-16px); opacity: 0.2; } 50% { transform: translateY(132px); opacity: 0.82; } }
      @keyframes dash { to { stroke-dashoffset: -260; } }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.52"/>
  <circle cx="1660" cy="188" r="320" fill="#10b981" opacity="0.06"/>
  <circle cx="240" cy="950" r="340" fill="#6366f1" opacity="0.05"/>

  <g class="font">
    <g transform="translate(84 60)">
      <rect width="58" height="58" rx="15" fill="url(#green)"/>
      <path d="M18 30 l11 12 28 -29" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="24" class="small">POLICYWATCHER 3.5</text>
      <text x="78" y="52" class="small" fill="#64748b">Dataset QA Engine</text>
    </g>

    <text x="84" y="180" class="eyebrow">CONFIDENCE RELEASE CONTROL LAYER</text>
    <text x="84" y="246" class="title">Quality assurance before amplification</text>
    <text x="84" y="290" class="subtitle">The QA engine turns dataset reliability into an inspectable workflow. Blockers stop promotion.</text>
    <text x="84" y="318" class="subtitle">Warnings remain visible and review decisions become evidence.</text>

    <g transform="translate(86 356)">
      <rect class="darkCard" width="500" height="566" rx="30"/>
      <text x="38" y="58" font-size="26" font-weight="860" fill="#ffffff">Release gate snapshot</text>
      <text x="38" y="92" font-size="16" font-weight="560" fill="#cbd5e1">Local 3.5.1 dataset assurance run: seed-only DB is gated</text>
      <line x1="38" x2="462" y1="124" y2="124" stroke="#334155"/>
      <g transform="translate(38 156)">
        <text class="metricDark" x="0" y="58">100</text>
        <text class="metricLabel" x="0" y="92" fill="#fecaca">SOURCE BLOCKERS</text>
        <rect x="188" y="8" width="252" height="72" rx="18" fill="#fef2f2" opacity="0.12" stroke="#ef4444"/>
        <text x="214" y="52" font-size="22" font-weight="850" fill="#fecaca">public data gated</text>
      </g>
      <g transform="translate(38 282)">
        <text class="metricDark" x="0" y="58">1</text>
        <text class="metricLabel" x="0" y="92" fill="#fcd34d">WARNING</text>
        <rect x="160" y="8" width="264" height="96" rx="18" fill="#fff7ed" opacity="0.1" stroke="#f59e0b"/>
        <text x="184" y="42" font-size="18" font-weight="850" fill="#fde68a">Plaid legal hub mapping</text>
        <text x="184" y="70" font-size="15" font-weight="560" fill="#cbd5e1">visible until confirmed or refined</text>
      </g>
      <g transform="translate(38 440)">
        <rect x="0" y="0" width="424" height="76" rx="18" fill="#ffffff" opacity="0.08" stroke="#334155"/>
        <text x="22" y="32" font-size="17" font-weight="850" fill="#ffffff">Design rule</text>
        <text x="22" y="56" font-size="15" font-weight="560" fill="#cbd5e1">Do not hide ambiguity to make the product look cleaner.</text>
      </g>
    </g>

    <g transform="translate(664 354)">
      <rect class="card" width="1172" height="266" rx="30"/>
      <text x="34" y="54" class="blockTitle">Automated checks</text>
      <text x="34" y="84" class="blockBody">Each check produces a finding area and severity.</text>
      <text x="34" y="108" class="blockBody">The output is machine-readable and exportable.</text>
      <g transform="translate(34 118)">
        <g>
          <rect x="0" y="0" width="254" height="104" rx="20" fill="#eef2ff" stroke="#c7d2fe"/>
          <text x="22" y="34" class="chip">Source fit</text>
          <text x="22" y="63" class="blockBody">canonical vs market URL</text>
        </g>
        <g transform="translate(278 0)">
          <rect width="254" height="104" rx="20" fill="#ecfdf5" stroke="#bbf7d0"/>
          <text x="22" y="34" class="chip">Hash integrity</text>
          <text x="22" y="63" class="blockBody">current text equals hash</text>
        </g>
        <g transform="translate(556 0)">
          <rect width="254" height="104" rx="20" fill="#ecfeff" stroke="#a5f3fc"/>
          <text x="22" y="34" class="chip">Snapshot chain</text>
          <text x="22" y="63" class="blockBody">latest version alignment</text>
        </g>
        <g transform="translate(834 0)">
          <rect width="254" height="104" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
          <text x="22" y="34" class="chip">Retrieval log</text>
          <text x="22" y="63" class="blockBody">status and text length</text>
        </g>
      </g>
    </g>

    <path class="trace" d="M1248 636 V708" fill="none" stroke="url(#green)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(664 710)">
      <rect class="card" width="1172" height="254" rx="30"/>
      <text x="34" y="54" class="blockTitle">Review workflow</text>
      <text x="34" y="84" class="blockBody">Dataset issues are not just displayed. They can be resolved, ignored with a reason,</text>
      <text x="34" y="108" class="blockBody">reopened and exported for auditor handoff.</text>

      <g transform="translate(34 124)">
        <g>
          <circle cx="38" cy="38" r="38" fill="#eef2ff" stroke="#c7d2fe"/>
          <text x="38" y="44" text-anchor="middle" font-size="16" font-weight="900" fill="#4f46e5">OPEN</text>
          <text x="92" y="28" class="chip">Open</text>
          <text x="92" y="55" class="blockBody">visible finding</text>
          <text x="92" y="78" class="blockBody">requiring disposition</text>
        </g>
        <g transform="translate(280 0)">
          <circle cx="38" cy="38" r="38" fill="#ecfdf5" stroke="#bbf7d0"/>
          <text x="38" y="44" text-anchor="middle" font-size="15" font-weight="900" fill="#047857">OK</text>
          <text x="92" y="28" class="chip">Reviewed</text>
          <text x="92" y="55" class="blockBody">human assessment</text>
          <text x="92" y="78" class="blockBody">recorded</text>
        </g>
        <g transform="translate(560 0)">
          <circle cx="38" cy="38" r="38" fill="#fff7ed" stroke="#fed7aa"/>
          <text x="38" y="44" text-anchor="middle" font-size="15" font-weight="900" fill="#92400e">NOTE</text>
          <text x="92" y="28" class="chip">Ignored with reason</text>
          <text x="92" y="55" class="blockBody">reason kept with</text>
          <text x="92" y="78" class="blockBody">the finding</text>
        </g>
        <g transform="translate(860 0)">
          <circle cx="38" cy="38" r="38" fill="#fef2f2" stroke="#fecaca"/>
          <text x="38" y="44" text-anchor="middle" font-size="15" font-weight="900" fill="#b91c1c">RE</text>
          <text x="92" y="28" class="chip">Reopened</text>
          <text x="92" y="55" class="blockBody">new evidence</text>
          <text x="92" y="78" class="blockBody">returns to queue</text>
        </g>
      </g>
    </g>

    <g transform="translate(636 332)">
      <rect x="0" y="0" width="24" height="654" rx="12" fill="url(#green)" opacity="0.22"/>
      <rect class="scan" x="0" y="22" width="24" height="110" rx="12" fill="url(#green)"/>
    </g>

    <g transform="translate(128 944)">
      <rect width="548" height="54" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
      <text x="24" y="34" class="small">OUTPUTS: Dataset QA page, review log, CSV export, release evidence</text>
    </g>
  </g>
</svg>
