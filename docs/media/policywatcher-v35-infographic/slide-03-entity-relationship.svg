<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PolicyWatcher Entity Relationship Schema</title>
  <desc id="desc">Entity relationship diagram for the PolicyWatcher database schema, highlighting policy monitoring, evidence logs, regional impacts and admin QA reviews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#dbe4f0" stroke-width="1" opacity="0.36"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Arial; }
      .mono { font-family: Monaco; }
      .title { font-size: 56px; font-weight: 860; fill: #0f172a; letter-spacing: -0.5px; }
      .subtitle { font-size: 22px; font-weight: 560; fill: #475569; }
      .eyebrow { font-size: 17px; font-weight: 860; fill: #4f46e5; letter-spacing: 2.6px; }
      .table { fill: rgba(255,255,255,0.97); stroke: #dbe4f0; stroke-width: 1.5; filter: url(#shadow); }
      .tableHead { fill: #0f172a; }
      .tableHeadCore { fill: url(#brand); }
      .tableHeadQa { fill: url(#green); }
      .tableTitle { font-size: 21px; font-weight: 850; fill: #ffffff; }
      .field { font-size: 14px; font-weight: 620; fill: #334155; }
      .pk { font-size: 14px; font-weight: 850; fill: #4f46e5; }
      .rel { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .relStrong { fill: none; stroke: #6366f1; stroke-width: 3.5; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #dbe4f0; stroke-width: 1.5; filter: url(#shadow); }
      .tag { font-size: 13px; font-weight: 850; fill: #64748b; letter-spacing: 0.9px; }
      .note { font-size: 15px; font-weight: 580; fill: #475569; }
      .cardinality { font-size: 14px; font-weight: 900; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.5"/>
  <circle cx="1600" cy="140" r="300" fill="#6366f1" opacity="0.05"/>
  <circle cx="230" cy="915" r="340" fill="#10b981" opacity="0.055"/>

  <g class="font">
    <g transform="translate(84 60)">
      <rect width="58" height="58" rx="15" fill="url(#brand)"/>
      <path d="M18 18 h22 v7 H25 v10 h14 v7 H18 Z" fill="#fff"/>
      <path d="M42 17 c8 6 9 19 0 25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="78" y="24" class="tag">POLICYWATCHER DATA MODEL</text>
      <text x="78" y="52" class="tag" fill="#64748b">Prisma SQLite schema - release 3.5.1</text>
    </g>
    <text x="84" y="180" class="eyebrow">ENTITY RELATIONSHIP VIEW</text>
    <text x="84" y="250" class="title">A schema built around evidence, not only content</text>
    <text x="84" y="292" class="subtitle">Policy text, versions, changes, impacts, check logs and admin decisions are separated so each layer remains inspectable.</text>

    <path class="relStrong" d="M352 478 H486"/>
    <text x="386" y="458" class="cardinality">1 to many</text>
    <path class="relStrong" d="M760 478 H894"/>
    <text x="792" y="458" class="cardinality">1 to many</text>
    <path class="relStrong" d="M1168 478 H1302"/>
    <text x="1197" y="458" class="cardinality">1 to many</text>
    <path class="rel" d="M623 618 V740 H1040 V654"/>
    <text x="700" y="726" class="cardinality">policy to check logs</text>
    <path class="rel" d="M1027 622 V734 H1448 V654"/>
    <text x="1110" y="720" class="cardinality">change to review log</text>
    <path class="rel" d="M1026 346 V312 H1448 V358"/>
    <text x="1110" y="300" class="cardinality">old/new snapshots</text>

    <g transform="translate(96 360)">
      <rect class="table" width="256" height="236" rx="22"/>
      <rect class="tableHeadCore" width="256" height="58" rx="22"/>
      <path d="M0 36 H256 V58 H0 Z" fill="url(#brand)"/>
      <text x="24" y="37" class="tableTitle">Company</text>
      <text x="24" y="88" class="pk mono">PK id</text>
      <text x="24" y="116" class="field mono">name, slug</text>
      <text x="24" y="144" class="field mono">industry</text>
      <text x="24" y="172" class="field mono">website</text>
      <text x="24" y="200" class="field mono">policies[]</text>
    </g>

    <g transform="translate(486 334)">
      <rect class="table" width="274" height="288" rx="22"/>
      <rect class="tableHeadCore" width="274" height="58" rx="22"/>
      <path d="M0 36 H274 V58 H0 Z" fill="url(#brand)"/>
      <text x="24" y="37" class="tableTitle">Policy</text>
      <text x="24" y="88" class="pk mono">PK id, FK companyId</text>
      <text x="24" y="116" class="field mono">type, jurisdiction, url</text>
      <text x="24" y="144" class="field mono">currentText, currentHash</text>
      <text x="24" y="172" class="field mono">dataStatus</text>
      <text x="24" y="200" class="field mono">lastCheckDate</text>
      <text x="24" y="228" class="field mono">lastSuccessfulCheckDate</text>
      <text x="24" y="256" class="field mono">ingestionMethod</text>
    </g>

    <g transform="translate(894 334)">
      <rect class="table" width="274" height="288" rx="22"/>
      <rect class="tableHead" width="274" height="58" rx="22"/>
      <path d="M0 36 H274 V58 H0 Z" fill="#0f172a"/>
      <text x="24" y="37" class="tableTitle">PolicySnapshot</text>
      <text x="24" y="88" class="pk mono">PK id, FK policyId</text>
      <text x="24" y="116" class="field mono">version</text>
      <text x="24" y="144" class="field mono">text</text>
      <text x="24" y="172" class="field mono">hash</text>
      <text x="24" y="200" class="field mono">createdAt</text>
      <text x="24" y="242" class="field mono">oldChanges[]</text>
      <text x="24" y="270" class="field mono">newChanges[]</text>
    </g>

    <g transform="translate(1302 306)">
      <rect class="table" width="342" height="348" rx="22"/>
      <rect class="tableHeadCore" width="342" height="58" rx="22"/>
      <path d="M0 36 H342 V58 H0 Z" fill="url(#brand)"/>
      <text x="24" y="37" class="tableTitle">PolicyChange</text>
      <text x="24" y="88" class="pk mono">PK id, FK policyId</text>
      <text x="24" y="116" class="field mono">oldSnapshotId?, newSnapshotId</text>
      <text x="24" y="144" class="field mono">diff</text>
      <text x="24" y="172" class="field mono">aiSummaryEn / aiSummaryIt</text>
      <text x="24" y="200" class="field mono">overallRisk, overallScore</text>
      <text x="24" y="228" class="field mono">15 KPI governance fields</text>
      <text x="24" y="256" class="field mono">riskReasonsJson</text>
      <text x="24" y="284" class="field mono">remediationsJson</text>
      <text x="24" y="312" class="field mono">regionImpacts[], reviewLogs[]</text>
    </g>

    <g transform="translate(1326 746)">
      <rect class="table" width="318" height="212" rx="22"/>
      <rect class="tableHead" width="318" height="58" rx="22"/>
      <path d="M0 36 H318 V58 H0 Z" fill="#0f172a"/>
      <text x="24" y="37" class="tableTitle">RegionImpact</text>
      <text x="24" y="88" class="pk mono">PK id, FK policyChangeId</text>
      <text x="24" y="116" class="field mono">region</text>
      <text x="24" y="144" class="field mono">perspective</text>
      <text x="24" y="172" class="field mono">riskLevel, complianceNote</text>
    </g>

    <g transform="translate(464 746)">
      <rect class="table" width="318" height="212" rx="22"/>
      <rect class="tableHeadQa" width="318" height="58" rx="22"/>
      <path d="M0 36 H318 V58 H0 Z" fill="url(#green)"/>
      <text x="24" y="37" class="tableTitle">PolicyCheckLog</text>
      <text x="24" y="88" class="pk mono">PK id, FK policyId</text>
      <text x="24" y="116" class="field mono">status, checkedAt, source</text>
      <text x="24" y="144" class="field mono">httpStatus, reason, finalUrl</text>
      <text x="24" y="172" class="field mono">textHash, textLength</text>
    </g>

    <g transform="translate(890 746)">
      <rect class="table" width="318" height="212" rx="22"/>
      <rect class="tableHeadQa" width="318" height="58" rx="22"/>
      <path d="M0 36 H318 V58 H0 Z" fill="url(#green)"/>
      <text x="24" y="37" class="tableTitle">AdminReviewLog</text>
      <text x="24" y="88" class="pk mono">PK id, FK policyChangeId?</text>
      <text x="24" y="116" class="field mono">actorRole, action</text>
      <text x="24" y="144" class="field mono">targetType, targetId</text>
      <text x="24" y="172" class="field mono">oldValue, newValue, note</text>
    </g>

    <g transform="translate(96 746)">
      <rect class="table" width="300" height="212" rx="22"/>
      <rect class="tableHeadQa" width="300" height="58" rx="22"/>
      <path d="M0 36 H300 V58 H0 Z" fill="url(#green)"/>
      <text x="24" y="37" class="tableTitle">DatasetQaIssueReview</text>
      <text x="24" y="88" class="pk mono">PK id, unique issueKey</text>
      <text x="24" y="116" class="field mono">status, severity, area</text>
      <text x="24" y="144" class="field mono">entityType, entityId</text>
      <text x="24" y="172" class="field mono">reason, reviewedByRole</text>
    </g>

    <g transform="translate(1688 360)">
      <rect class="table" width="172" height="236" rx="22"/>
      <rect class="tableHead" width="172" height="58" rx="22"/>
      <path d="M0 36 H172 V58 H0 Z" fill="#0f172a"/>
      <text x="24" y="37" class="tableTitle">Subscriber</text>
      <text x="24" y="88" class="pk mono">PK id</text>
      <text x="24" y="116" class="field mono">email</text>
      <text x="24" y="144" class="field mono">regions</text>
      <text x="24" y="172" class="field mono">industries</text>
      <text x="24" y="200" class="field mono">frequency</text>
    </g>

    <g transform="translate(84 984)">
      <rect width="1752" height="56" rx="18" fill="#ffffff" stroke="#dbe4f0" filter="url(#shadow)"/>
      <text x="28" y="35" class="note">Design reading: core monitoring entities sit on the upper rail; evidence and QA entities sit below. This keeps source retrieval, AI interpretation and human review auditable as separate records.</text>
    </g>
  </g>
</svg>
