<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PolicyWatcher 3.5 Confidence Architecture</title>
  <desc id="desc">Architecture infographic for the PolicyWatcher 3.5 confidence release, showing configured sources, retrieval evidence, dataset QA, AI analysis and public/admin outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="qa" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#dbe4f0" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6366f1"/>
    </marker>
    <style>
      .font { font-family: Arial; }
      .mono { font-family: Monaco; }
      .title { font-size: 50px; font-weight: 850; fill: #0f172a; letter-spacing: -0.5px; }
      .subtitle { font-size: 22px; font-weight: 560; fill: #475569; }
      .eyebrow { font-size: 18px; font-weight: 850; fill: #4f46e5; letter-spacing: 2.8px; }
      .small { font-size: 18px; font-weight: 560; fill: #64748b; }
      .label { font-size: 24px; font-weight: 820; fill: #0f172a; }
      .body { font-size: 18px; font-weight: 560; fill: #475569; }
      .micro { font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
      .metric { font-size: 34px; font-weight: 850; fill: #0f172a; }
      .metricLabel { font-size: 14px; font-weight: 850; fill: #64748b; letter-spacing: 1.4px; }
      .node { fill: rgba(255,255,255,0.92); stroke: #dbe4f0; stroke-width: 1.5; filter: url(#softShadow); }
      .ring { fill: none; stroke-width: 2; stroke-dasharray: 10 16; opacity: 0.42; transform-origin: 960px 560px; animation: rotate 30s linear infinite; }
      .ring2 { animation-duration: 42s; animation-direction: reverse; }
      .pulse { animation: pulse 2.9s ease-in-out infinite; }
      .trace { stroke-dasharray: 10 16; animation: dash 18s linear infinite; }
      @keyframes rotate { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.84; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -260; } }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.38"/>
  <circle cx="1600" cy="120" r="310" fill="#6366f1" opacity="0.055"/>
  <circle cx="190" cy="940" r="360" fill="#06b6d4" opacity="0.06"/>

  <g class="font">
    <g transform="translate(84 64)">
      <rect x="0" y="0" width="62" height="62" rx="16" fill="url(#brand)" filter="url(#softShadow)"/>
      <path d="M19 19 h24 v7 H26 v10 h15 v7 H19 Z" fill="#fff" opacity="0.96"/>
      <path d="M44 18 c8 5 9 20 0 26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.96"/>
      <text x="82" y="25" class="micro">POLICYWATCHER</text>
      <text x="82" y="55" class="small">Release 3.5 Confidence Architecture</text>
    </g>

    <text x="84" y="198" class="eyebrow">INSPECTABLE POLICY MONITORING STACK</text>
    <text x="84" y="252" class="title">From configured sources</text>
    <text x="84" y="310" class="title">to reviewable evidence</text>
    <text x="84" y="354" class="subtitle">PolicyWatcher maps public policy texts, records retrieval evidence, detects changes</text>
    <text x="84" y="384" class="subtitle">and exposes QA status before analysis is promoted.</text>

    <g transform="translate(84 874)">
      <rect x="0" y="0" width="1752" height="128" rx="26" fill="#ffffff" stroke="#dbe4f0" filter="url(#softShadow)"/>
      <g transform="translate(34 32)">
        <text class="metric" x="0" y="38">16</text><text class="metricLabel" x="0" y="70">CONFIGURED CO.</text>
      </g>
      <g transform="translate(238 32)">
        <text class="metric" x="0" y="38">50</text><text class="metricLabel" x="0" y="70">CONFIGURED</text>
      </g>
      <g transform="translate(442 32)">
        <text class="metric" x="0" y="38">103</text><text class="metricLabel" x="0" y="70">LOCAL SNAPSHOTS</text>
      </g>
      <g transform="translate(672 32)">
        <text class="metric" x="0" y="38">53</text><text class="metricLabel" x="0" y="70">SEED CHANGES</text>
      </g>
      <g transform="translate(888 32)">
        <text class="metric" x="0" y="38">318</text><text class="metricLabel" x="0" y="70">SEED IMPACTS</text>
      </g>
      <g transform="translate(1184 32)">
        <text class="metric" x="0" y="38">50</text><text class="metricLabel" x="0" y="70">SEED CHECKS</text>
      </g>
      <g transform="translate(1432 26)">
        <rect x="0" y="0" width="262" height="76" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/>
        <circle cx="32" cy="38" r="10" fill="#10b981"/>
        <text class="metric" x="58" y="44" font-size="30">gated seed</text>
        <text class="metricLabel" x="58" y="66">LOCAL QA SNAPSHOT</text>
      </g>
    </g>

    <g transform="translate(960 560)">
      <circle class="ring" r="328" stroke="#6366f1"/>
      <circle class="ring ring2" r="246" stroke="#06b6d4"/>
      <circle r="148" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" filter="url(#shadow)"/>
      <circle r="104" fill="url(#brand)" opacity="0.11"/>
      <path d="M-44 -40 h88 v20 H-22 v22 h56 v18 h-56 v38 h-22 Z" fill="#4f46e5"/>
      <path d="M56 -42 c28 17 31 71 0 94" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round"/>
      <text x="0" y="106" text-anchor="middle" class="label">Evidence Core</text>
      <text x="0" y="136" text-anchor="middle" class="body">hashes, logs, QA state</text>
    </g>

    <path class="trace" d="M430 498 C590 430 730 402 828 457" fill="none" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
    <path class="trace" d="M1092 457 C1230 388 1395 420 1510 498" fill="none" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
    <path class="trace" d="M1458 678 C1300 760 1145 760 1056 668" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrow)"/>
    <path class="trace" d="M864 668 C722 770 558 752 440 678" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(126 420)" class="pulse">
      <rect class="node" x="0" y="0" width="360" height="168" rx="26"/>
      <rect x="26" y="28" width="54" height="54" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
      <path d="M42 52 h22 M42 64 h30 M42 40 h18" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
      <text x="104" y="52" class="label">Configured Sources</text>
      <text x="104" y="86" class="body">Provider URLs by policy type,</text>
      <text x="104" y="114" class="body">jurisdiction and market context.</text>
    </g>

    <g transform="translate(1434 420)" class="pulse">
      <rect class="node" x="0" y="0" width="360" height="168" rx="26"/>
      <rect x="26" y="28" width="54" height="54" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
      <path d="M44 62 c20 -28 36 -28 56 0 M53 42 v52 M91 42 v52" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
      <text x="104" y="52" class="label">Retrieval Cascade</text>
      <text x="104" y="86" class="body">Direct, HTTP/2, VPS render,</text>
      <text x="104" y="114" class="body">freshness-guarded archives.</text>
    </g>

    <g transform="translate(1434 644)" class="pulse">
      <rect class="node" x="0" y="0" width="360" height="168" rx="26"/>
      <rect x="26" y="28" width="54" height="54" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
      <path d="M40 56 l14 16 32 -34" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="52" class="label">Dataset QA Gate</text>
      <text x="104" y="86" class="body">Integrity, source-fit, coverage,</text>
      <text x="104" y="114" class="body">timestamps and issue decisions.</text>
    </g>

    <g transform="translate(126 644)" class="pulse">
      <rect class="node" x="0" y="0" width="360" height="168" rx="26"/>
      <rect x="26" y="28" width="54" height="54" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
      <path d="M40 68 h30 M40 50 h52 M40 86 h38" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <text x="104" y="52" class="label">Analysis Boundary</text>
      <text x="104" y="86" class="body">AI-assisted summaries, KPIs</text>
      <text x="104" y="114" class="body">and regional impacts with limits.</text>
    </g>

    <g transform="translate(604 382)">
      <rect class="node" x="0" y="0" width="292" height="92" rx="22"/>
      <text x="26" y="40" class="label">Admin Console</text>
      <text x="26" y="68" class="body">review log, QA actions, exports</text>
    </g>
    <g transform="translate(1024 382)">
      <rect class="node" x="0" y="0" width="292" height="92" rx="22"/>
      <text x="26" y="40" class="label">Public Surface</text>
      <text x="26" y="68" class="body">timeline, cards, trust pages</text>
    </g>
  </g>
</svg>
