nal same-origin attachments</text><path d="M437.5,533 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="350.0" y="505" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S06 immutable artifact + fetch result; queue policy dependent</text><path d="M437.5,611 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="350.0" y="583" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S07 integrity read, assessment and candidate confirmation</text><path d="M437.5,689 H787.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="612.5" y="661" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S08 analyze old/new parent evidence outside transaction</text><path d="M787.5,767 H437.5" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sequence-arrow)"/><text x="612.5" y="739" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S09 claims, exact span validation</text><path d="M437.5,845 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="350.0" y="817" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S10 checkpoint analyze-to-verify</text><path d="M437.5,923 H962.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="700.0" y="895" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S11 verify grounded claims outside transaction</text><path d="M962.5,1001 H437.5" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sequence-arrow)"/><text x="700.0" y="973" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S12 verdicts + resolved identity</text><path d="M437.5,1079 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="350.0" y="1051" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S13 commit checkpoint; revalidate gates</text><path d="M437.5,1157 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="350.0" y="1129" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S14 private state/review/validated claim ledger; no public change</text><rect x="5" y="1187" width="1390" height="75" rx="8" fill="#eaf2ff"/><path d="M437.5,1235 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="350.0" y="1207" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S15 one fenced transaction: CAS context, snapshot, baseline, change,</text><text x="350.0" y="1221" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">claims, optional canonical projection and outbox, task completion</text><path d="M1137.5,1313 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="700.0" y="1285" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S16 separate claim and root fanout transaction</text><path d="M1137.5,1391 H1312.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="1210" y="1363" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S17 per-recipient send outside publication transaction</text><path d="M1312.5,1469 H1137.5" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#sequence-arrow)"/><text x="1210" y="1441" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S18 acknowledgement</text><path d="M1137.5,1547 H262.5" stroke="#6366f1" stroke-width="1.6"  marker-end="url(#sequence-arrow)"/><text x="700.0" y="1519" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#334155">S19 mark delivered or retry under lease</text></svg>