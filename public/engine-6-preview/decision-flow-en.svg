<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Engine 6 Preview decision flow</title><desc id="desc">Complete source evidence, comparable baseline, two independent captures, exact claims and verification precede gated publication.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4338ca"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs><rect width="1200" height="940" fill="#f8fafc"/><g font-family="'Titillium Web', 'Segoe UI', sans-serif"><text x="34" y="38" font-size="17" font-weight="700" fill="#0f766e" text-anchor="start">02 / DECISION FLOW</text><rect x="380" y="65" width="440" height="70" rx="4" fill="#172b46" stroke="#172b46" stroke-width="1.5"/><text x="398" y="97" font-size="19.9" font-weight="650" fill="#ffffff" text-anchor="start">Due policy + reviewed source contract</text><path d="M600 135V165" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="165" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="197" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Capture identity and completeness</text><text x="398" y="223" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Official source · language · required sections</text><path d="M380 210H320" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="30" y="165" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="197" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Incomplete / blocked</text><text x="48" y="223" font-size="16" font-weight="400" fill="#92400e" text-anchor="start">Hold with an explicit reason</text><path d="M600 255V295" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="295" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="327" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Compare with an eligible baseline</text><text x="398" y="353" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Missing/incompatible baseline → review</text><path d="M820 340H880" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="880" y="295" width="290" height="90" rx="4" fill="#eaf6f3" stroke="#76b6a8" stroke-width="1.5"/><text x="898" y="327" font-size="20" font-weight="650" fill="#0f766e" text-anchor="start">Unchanged</text><text x="898" y="353" font-size="16" font-weight="400" fill="#0f766e" text-anchor="start">Record verified check</text><path d="M600 385V425" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="425" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="457" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Confirm the changed candidate</text><text x="398" y="483" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Two fresh captures · different runs · 1h–7d</text><path d="M820 470H880" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="880" y="425" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="898" y="457" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Wait for confirmation</text><text x="898" y="483" font-size="15.0" font-weight="400" fill="#92400e" text-anchor="start">304 / retry is not a new capture</text><path d="M600 515V555" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="555" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="587" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Analyse all deltas + verify claims</text><text x="398" y="613" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Exact evidence · separate verification call</text><path d="M380 600H320" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="30" y="555" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="587" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Unsupported / uncertain</text><text x="48" y="613" font-size="13.3" font-weight="400" fill="#92400e" text-anchor="start">Hold; approval cannot waive evidence</text><path d="M600 645V685" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="685" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="717" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Supported evidence + impact gate</text><text x="398" y="743" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Publication mode must be enabled</text><path d="M380 730H320" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="30" y="685" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="717" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Verified high impact</text><text x="48" y="743" font-size="16" font-weight="400" fill="#92400e" text-anchor="start">Human review + context recheck</text><path d="M600 775V825" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal-arrow)"/><text x="622" y="805" font-size="15" font-weight="400" fill="#0f766e" text-anchor="start">lower impact</text><rect x="380" y="825" width="440" height="80" rx="4" fill="#eaf6f3" stroke="#76b6a8" stroke-width="1.5"/><text x="398" y="857" font-size="20" font-weight="650" fill="#0f766e" text-anchor="start">Atomic public commit → outbox</text><text x="398" y="883" font-size="16" font-weight="400" fill="#0f766e" text-anchor="start">Delivery is a later, separate step</text><path d="M175 775V865H380" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="40" y="837" font-size="15" font-weight="400" fill="#92400e" text-anchor="start">approved, still current</text></g></svg>