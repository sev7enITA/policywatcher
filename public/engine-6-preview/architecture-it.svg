<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Architettura Engine 6 Preview</title><desc id="desc">Le fonti entrano nelle prove private. Solo prove supportate attraversano il confine di pubblicazione atomica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4338ca"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs><rect width="1200" height="600" fill="#f8fafc"/><g font-family="'Titillium Web', 'Segoe UI', sans-serif"><text x="34" y="42" font-size="17" font-weight="700" fill="#0f766e" text-anchor="start">01 / ARCHITETTURA</text><text x="34" y="72" font-size="25" font-weight="650" fill="#172b46" text-anchor="start">Fonte ufficiale → lavoro privato → evidenze pubbliche</text><rect x="330" y="105" width="540" height="435" rx="6" fill="#eef2ff" stroke="#bac4ea" stroke-dasharray="5 4"/><text x="352" y="135" font-size="15" font-weight="700" fill="#4338ca" text-anchor="start">PROVE DI LAVORO PRIVATE</text><rect x="30" y="185" width="260" height="140" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="217" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Documenti ufficiali</text><text x="48" y="243" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">HTTP · HTTP/2</text><text x="48" y="266" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Renderer configurato</text><text x="48" y="289" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Recupero con limiti</text><path d="M290 255H320V205H350" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="160" width="500" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="192" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Coda persistente + attese per origine</text><text x="368" y="218" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Attività · lease · tentativi · checkpoint</text><path d="M600 250V270" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="270" width="500" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="302" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Controlli fonte + catture congelate</text><text x="368" y="328" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Identità · completezza · lingua · integrità</text><path d="M600 360V380" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="380" width="500" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="368" y="412" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Confrontare → analizzare → verificare</text><text x="368" y="438" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Citazioni esatte · copertura di tutti i delta</text><path d="M850 425H900" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="380" width="270" height="120" rx="4" fill="#eaf6f3" stroke="#76b6a8" stroke-width="1.5"/><text x="918" y="412" font-size="20" font-weight="650" fill="#0f766e" text-anchor="start">Commit atomico</text><text x="918" y="438" font-size="14.7" font-weight="400" fill="#0f766e" text-anchor="start">Baseline + versione + modifica</text><text x="918" y="461" font-size="16" font-weight="400" fill="#0f766e" text-anchor="start">Prove pubbliche + outbox</text><rect x="30" y="395" width="260" height="125" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="427" font-size="17.7" font-weight="650" fill="#92400e" text-anchor="start">Revisione / sospensione</text><text x="48" y="453" font-size="16" font-weight="400" fill="#92400e" text-anchor="start">Alto impatto o incertezza</text><text x="48" y="476" font-size="16" font-weight="400" fill="#92400e" text-anchor="start">Prove mancanti: sospendere</text><path d="M350 425H290" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="352" y="513" font-size="16" font-weight="400" fill="#4338ca" text-anchor="start">Observe mantiene privati i risultati candidati.</text><rect x="900" y="160" width="270" height="125" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="918" y="192" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Invio separato</text><text x="918" y="218" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Dopo commit e consenso</text><text x="918" y="241" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Coda notifiche con retry</text><path d="M1035 380V285" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal-arrow)"/><text x="34" y="575" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Implementazione sperimentale locale. Lo schema non descrive un motore attivato in produzione.</text></g></svg>