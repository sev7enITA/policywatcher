<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Flusso decisionale Engine 6 Preview</title><desc id="desc">Prove complete, baseline confrontabile, due catture indipendenti, citazioni e verifica precedono la pubblicazione controllata.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4338ca"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs><rect width="1200" height="940" fill="#f8fafc"/><g font-family="'Titillium Web', 'Segoe UI', sans-serif"><text x="34" y="38" font-size="17" font-weight="700" fill="#0f766e" text-anchor="start">02 / FLUSSO DECISIONALE</text><rect x="380" y="65" width="440" height="70" rx="4" fill="#172b46" stroke="#172b46" stroke-width="1.5"/><text x="398" y="97" font-size="19.9" font-weight="650" fill="#ffffff" text-anchor="start">Policy dovuta + contratto revisionato</text><path d="M600 135V165" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="165" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="197" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Identità e completezza della cattura</text><text x="398" y="223" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Fonte ufficiale · lingua · sezioni richieste</text><path d="M380 210H320" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="30" y="165" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="197" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Incompleta / bloccata</text><text x="48" y="223" font-size="16" font-weight="400" fill="#92400e" text-anchor="start">Sospendere con motivo</text><path d="M600 255V295" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="295" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="327" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Confrontare una baseline idonea</text><text x="398" y="353" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Baseline assente/incompatibile → revisione</text><path d="M820 340H880" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="880" y="295" width="290" height="90" rx="4" fill="#eaf6f3" stroke="#76b6a8" stroke-width="1.5"/><text x="898" y="327" font-size="20" font-weight="650" fill="#0f766e" text-anchor="start">Invariata</text><text x="898" y="353" font-size="16" font-weight="400" fill="#0f766e" text-anchor="start">Registrare la verifica</text><path d="M600 385V425" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="425" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="457" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Confermare il candidato modificato</text><text x="398" y="483" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Due catture nuove · run distinti · 1h–7g</text><path d="M820 470H880" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="880" y="425" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="898" y="457" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Attendere la conferma</text><text x="898" y="483" font-size="13.7" font-weight="400" fill="#92400e" text-anchor="start">304 / retry non è una nuova cattura</text><path d="M600 515V555" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="555" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="587" font-size="15.6" font-weight="650" fill="#172b46" text-anchor="start">Analizzare i delta + verificare le affermazioni</text><text x="398" y="613" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">Prove esatte · chiamata di verifica separata</text><path d="M380 600H320" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="30" y="555" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="587" font-size="19.2" font-weight="650" fill="#92400e" text-anchor="start">Non supportata / incerta</text><text x="48" y="613" font-size="12.3" font-weight="400" fill="#92400e" text-anchor="start">Sospendere; le prove restano necessarie</text><path d="M600 645V685" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="685" width="440" height="90" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="398" y="717" font-size="20" font-weight="650" fill="#172b46" text-anchor="start">Prove supportate + controllo impatto</text><text x="398" y="743" font-size="16" font-weight="400" fill="#172b46" text-anchor="start">La pubblicazione deve essere abilitata</text><path d="M380 730H320" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="30" y="685" width="290" height="90" rx="4" fill="#fffbeb" stroke="#d6b37b" stroke-width="1.5"/><text x="48" y="717" font-size="20" font-weight="650" fill="#92400e" text-anchor="start">Alto impatto verificato</text><text x="48" y="743" font-size="16" font-weight="400" fill="#92400e" text-anchor="start">Revisione umana + ricontrollo</text><path d="M600 775V825" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal-arrow)"/><text x="622" y="805" font-size="15" font-weight="400" fill="#0f766e" text-anchor="start">impatto contenuto</text><rect x="380" y="825" width="440" height="80" rx="4" fill="#eaf6f3" stroke="#76b6a8" stroke-width="1.5"/><text x="398" y="857" font-size="20" font-weight="650" fill="#0f766e" text-anchor="start">Commit pubblico atomico → outbox</text><text x="398" y="883" font-size="16" font-weight="400" fill="#0f766e" text-anchor="start">L’invio è una fase successiva e separata</text><path d="M175 775V865H380" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="40" y="837" font-size="15" font-weight="400" fill="#92400e" text-anchor="start">approvata e ancora attuale</text></g></svg>